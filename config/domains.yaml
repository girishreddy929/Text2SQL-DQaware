# Single source of truth: which raw tables belong to which business domain,
# and their proper column types. Used by build_domains.py now, and by the
# Domain Selector agent in Block 16.
domains:

  sales:
    description: "Orders, their line items (products, sellers, prices) and payments"
    tables:
      orders:
        source: orders
        primary_key: [order_id]
        columns:
          order_id: text
          customer_id: text
          order_status: text
          order_purchase_timestamp: timestamp
          order_approved_at: timestamp
          order_delivered_carrier_date: timestamp
          order_delivered_customer_date: timestamp
          order_estimated_delivery_date: timestamp
      order_items:
        source: order_items
        primary_key: [order_id, order_item_id]
        columns:
          order_id: text
          order_item_id: integer
          product_id: text
          seller_id: text
          shipping_limit_date: timestamp
          price: "numeric(12,2)"
          freight_value: "numeric(12,2)"
      order_payments:
        source: order_payments
        primary_key: [order_id, payment_sequential]
        columns:
          order_id: text
          payment_sequential: integer
          payment_type: text
          payment_installments: integer
          payment_value: "numeric(12,2)"

  customer:
    description: "Customers, their locations (zip code geolocation) and order reviews"
    tables:
      customers:
        source: customers
        primary_key: [customer_id]
        columns:
          customer_id: text
          customer_unique_id: text
          customer_zip_code_prefix: text
          customer_city: text
          customer_state: text
      geolocation:
        source: geolocation
        primary_key: []
        columns:
          geolocation_zip_code_prefix: text
          geolocation_lat: "double precision"
          geolocation_lng: "double precision"
          geolocation_city: text
          geolocation_state: text
      order_reviews:
        source: order_reviews
        primary_key: []
        columns:
          review_id: text
          order_id: text
          review_score: integer
          review_comment_title: text
          review_comment_message: text
          review_creation_date: timestamp
          review_answer_timestamp: timestamp

  catalog:
    description: "Products, sellers and product category name translations"
    tables:
      products:
        source: products
        primary_key: [product_id]
        columns:
          product_id: text
          product_category_name: text
          product_name_lenght: integer
          product_description_lenght: integer
          product_photos_qty: integer
          product_weight_g: integer
          product_length_cm: integer
          product_height_cm: integer
          product_width_cm: integer
      sellers:
        source: sellers
        primary_key: [seller_id]
        columns:
          seller_id: text
          seller_zip_code_prefix: text
          seller_city: text
          seller_state: text
      category_translation:
        source: category_translation
        primary_key: [product_category_name]
        columns:
          product_category_name: text
          product_category_name_english: text
  marketing:
    description: "Marketing funnel: qualified leads and closed deals (joins to sellers via seller_id)"
    tables:
      qualified_leads:
        source: qualified_leads
        primary_key: [mql_id]
        columns:
          mql_id: text
          first_contact_date: date
          landing_page_id: text
          origin: text
      closed_deals:
        source: closed_deals
        primary_key: [mql_id]
        columns:
          mql_id: text
          seller_id: text
          sdr_id: text
          sr_id: text
          won_date: timestamp
          business_segment: text
          lead_type: text
          lead_behaviour_profile: text
          has_company: text
          has_gtin: text
          average_stock: text
          business_type: text
          declared_product_catalog_size: "numeric(12,2)"
          declared_monthly_revenue: "numeric(14,2)"